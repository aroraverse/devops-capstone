# Used by Argo CD. The CI "gitops-bump" job rewrites the repository owner and tag after every green build on main.
backend:
  image:
    repository: ghcr.io/aroraverse/helpdesk-backend
    tag: "359c9892e02be6f5ce17e940f0b2caa5df547662"
frontend:
  replicas: 2 # GitOps demo: change to 3, commit, push, watch Argo CD scale it
  image:
    repository: ghcr.io/aroraverse/helpdesk-frontend
    tag: "359c9892e02be6f5ce17e940f0b2caa5df547662"
ingress:
  enabled: true
  host: gitops.helpdesk.local # separate host so it can run next to the Helm (dev) install
hpa:
  enabled: true
monitoring:
  serviceMonitor:
    enabled: true
